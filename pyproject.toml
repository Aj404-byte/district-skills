[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "district-skills"
version = "0.1.0"
description = "Agent skills + CLI for District by Zomato: events, movies, showtimes, restaurants, bookings"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = []
keywords = ["district", "zomato", "claude", "agent-skills", "cli", "movies", "events"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Environment :: Console",
]

[project.scripts]
district = "district_skills.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/district_skills"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
